[tool.poetry]
name = "fastapi-backend-template"
version = "0.1.0"
description = "Базовый шаблон FastAPI приложений"
authors = ["Курдюмов Максим Олегович <dfrozzze@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.115.12"
uvicorn = "^0.34.0"
sqlalchemy = {version = "^2.0.40", extras = ["asyncio"]}
pydantic = {extras = ["email"], version = "^2.14.1"}
redis = "^8.1.0"
argon2-cffi = "^25.1.0"
alembic = "^1.15.2"
pydantic-settings = "^2.16.0"
asyncpg = "^0.30.0"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.0"
pre-commit = "^4.0.1"
mypy = "^1.13.0"
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "seed_data",
]

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "UP", # pyupgrade
    "I",
]
ignore = ["F401", "E712"]

[tool.ruff.format]
# Использовать двойные кавычки
quote-style = "double"
# Использовать пробелы вместо табов
indent-style = "space"
# Оставлять "магические" висячие запятые для удобного переноса строк
skip-magic-trailing-comma = false
# Автоматически выбрать стиль перевода строк под среду/файл
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
